name: throwoff-production

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true

services:
  app:
    image: throwoff-app:${IMAGE_TAG:?Set IMAGE_TAG to the exact production commit SHA}
    container_name: throwoff-app
    restart: unless-stopped
    init: true
    env_file:
      - ${THROWOFF_ENV_FILE:-/srv/throwoff/shared/env/.env.prod}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-throwoff}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-throwoff}?schema=public
    ports:
      - "127.0.0.1:${THROWOFF_APP_PORT:-3003}:3000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - internal
    logging: *default-logging
    <<: *service-security

  worker:
    image: throwoff-worker:${IMAGE_TAG:?Set IMAGE_TAG to the exact production commit SHA}
    container_name: throwoff-worker
    restart: unless-stopped
    init: true
    command: ["npm", "run", "worker"]
    env_file:
      - ${THROWOFF_ENV_FILE:-/srv/throwoff/shared/env/.env.prod}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-throwoff}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-throwoff}?schema=public
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - internal
    logging: *default-logging
    <<: *service-security

  migrate:
    image: throwoff-worker:${IMAGE_TAG:?Set IMAGE_TAG to the exact production commit SHA}
    container_name: throwoff-migrate
    profiles: ["migration"]
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ${THROWOFF_ENV_FILE:-/srv/throwoff/shared/env/.env.prod}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-throwoff}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/${POSTGRES_DB:-throwoff}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging
    <<: *service-security

  db:
    image: postgres:16-alpine
    container_name: throwoff-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-throwoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-throwoff}
    volumes:
      - /srv/throwoff/shared/db/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-throwoff} -d ${POSTGRES_DB:-throwoff}"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    networks:
      - internal
    logging: *default-logging
    <<: *service-security

networks:
  internal:
    name: throwoff-internal
