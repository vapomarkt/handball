services:
  postgres:
    image: postgres:16-alpine
    container_name: anwurf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anwurf
      POSTGRES_PASSWORD: anwurf_dev_password
      POSTGRES_DB: anwurf
    ports:
      - "5432:5432"
    volumes:
      - anwurf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anwurf -d anwurf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anwurf_pgdata:
