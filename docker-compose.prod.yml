services:
  postgres:
    image: postgres:16-alpine
    container_name: throwoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-throwoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-throwoff}
    volumes:
      - throwoff_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-throwoff} -d ${POSTGRES_DB:-throwoff}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    build:
      context: .
      target: worker
    container_name: throwoff-migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-throwoff}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-throwoff}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://throwoff.app}
    container_name: throwoff-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-throwoff}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-throwoff}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET muss gesetzt sein}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://throwoff.app}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://throwoff.app}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://www.throwoff.app}
      # nginx-proxy & acme-companion (Let's Encrypt)
      VIRTUAL_HOST: ${VIRTUAL_HOST:-throwoff.app,www.throwoff.app}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-throwoff.app,www.throwoff.app}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-hello@throwoff.app}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy

  worker:
    build:
      context: .
      target: worker
    container_name: throwoff-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-throwoff}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-throwoff}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  throwoff_pgdata:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy}
